# =========================================================
# PRODUCCION (Render gratis: 512 MB de memoria y poca CPU)
# Se activa con SPRING_PROFILES_ACTIVE=prod (lo hace el Dockerfile).
# Sobrescribe lo de application.properties; las credenciales siguen viniendo del entorno.
# =========================================================

# Render indica el puerto en la variable PORT
server.port=${PORT:8080}

# Detras del proxy de Render: tomar https y el host reales de las cabeceras X-Forwarded-*
server.forward-headers-strategy=framework

# Cookie de sesion: solo por https, no legible desde JavaScript
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Menos CPU y menos ruido en el log
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN

# Arranque mas rapido: Hibernate no consulta los metadatos de la base al iniciar
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Pocas conexiones y pocos hilos: sobran para un panel de uso ocasional y ahorran memoria
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=20
server.tomcat.max-connections=100

# Paginas y estilos comprimidos (menos datos por la red)
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
server.compression.min-response-size=1024

# Archivos estaticos con cache en el navegador (los cambios de CSS/JS llegan al pasar una hora)
spring.web.resources.cache.cachecontrol.max-age=1h
