<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8" />
    <title th:text="${data.title}">Catálogo</title>
    <style th:inline="text">
        @page {
            size: A4;
            margin: 15mm 13mm 17mm 13mm;

            @bottom-center {
                content: counter(page);
                font-family: Helvetica, Arial, sans-serif;
                font-size: 8pt;
                color: #8a86a0;
            }

            @bottom-left {
                content: "[[${footerText}]]";
                font-family: "Playfair Display", serif;
                font-size: 8pt;
                color: #8a86a0;
            }
        }

        @page :first {
            margin: 0;

            @bottom-center { content: none; }
            @bottom-left { content: none; }
        }

        body {
            margin: 0;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 8pt;
            color: #2a2550;
        }

        /* ---------------------------------------------------- portada */
        .cover {
            position: relative;
            height: 296mm;
            background-color: #efeaff;
            page-break-after: always;
        }

        .cover-inner {
            position: absolute;
            top: 62mm;
            left: 0;
            right: 0;
            text-align: center;
        }

        .cover-logo {
            width: 124mm;
        }

        .cover-rule {
            width: 38mm;
            height: 0.8mm;
            margin: 14mm auto 12mm auto;
            background-color: #6c47ff;
        }

        .cover-title {
            font-family: "Playfair Display", serif;
            font-weight: bold;
            font-size: 34pt;
            color: #2a2550;
        }

        .cover-scope {
            margin-top: 4mm;
            font-family: "Playfair Display", serif;
            font-size: 15pt;
            color: #6c47ff;
        }

        .cover-date {
            margin-top: 8mm;
            font-size: 9pt;
            letter-spacing: 1pt;
            color: #6b6790;
        }

        .cover-contact {
            position: absolute;
            bottom: 16mm;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 8.5pt;
            color: #6b6790;
        }

        .cover-contact .tagline {
            margin-bottom: 3mm;
            font-family: "Playfair Display", serif;
            font-size: 10.5pt;
            color: #2a2550;
        }

        /* ---------------------------------------------------- secciones */
        .section-title {
            margin: 0 0 5mm 0;
            padding-bottom: 2mm;
            border-bottom: 0.6mm solid #6c47ff;
            font-family: "Playfair Display", serif;
            font-weight: bold;
            font-size: 17pt;
            color: #2a2550;
            page-break-after: avoid;
        }

        .section-title.is-new {
            color: #6c47ff;
        }

        .section {
            margin-bottom: 4mm;
        }

        table.grid {
            border-collapse: collapse;
            table-layout: fixed;
            width: 180mm;
        }

        tr.grid-row {
            page-break-inside: avoid;
        }

        td.cell {
            width: 48mm;
            padding: 0 6mm 5mm 6mm;
            overflow: hidden;
            vertical-align: top;
        }

        /* ---------------------------------------------------- tarjeta de producto */
        .card {
            page-break-inside: avoid;
        }

        .photo {
            width: 48mm;
            height: 64mm;
            border-radius: 2mm;
        }

        .photo-empty {
            width: 48mm;
            height: 64mm;
            background-color: #f4f1fa;
            border-radius: 2mm;
        }

        .thumbs {
            margin-top: 1.5mm;
        }

        .thumb {
            width: 17.5mm;
            height: 17.5mm;
            margin-right: 1.2mm;
            border-radius: 1mm;
        }

        .badges {
            margin-top: 2mm;
            height: 4.2mm;
        }

        .badge {
            display: inline-block;
            padding: 0.6mm 2mm;
            margin-right: 1.2mm;
            border-radius: 2mm;
            font-size: 6pt;
            font-weight: bold;
            letter-spacing: 0.6pt;
            background-color: #efeaff;
            color: #4b2dd0;
        }

        .badge.is-request {
            background-color: #fff4d6;
            color: #8a5a00;
        }

        .badge.is-soldout {
            background-color: #fdecec;
            color: #b42318;
        }

        .name {
            margin-top: 1mm;
            font-family: "Playfair Display", serif;
            font-weight: bold;
            font-size: 10.5pt;
            line-height: 1.15;
            color: #2a2550;
        }

        .code {
            margin-top: 0.6mm;
            font-size: 6.5pt;
            letter-spacing: 0.8pt;
            color: #8a86a0;
        }

        .price {
            margin-top: 1.6mm;
            font-family: "Playfair Display", serif;
            font-weight: bold;
            font-size: 11.5pt;
            color: #6c47ff;
        }

        .price .old {
            font-family: Helvetica, Arial, sans-serif;
            font-weight: normal;
            font-size: 8pt;
            color: #8a86a0;
            text-decoration: line-through;
            margin-right: 1.5mm;
        }

        .price .off {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 6.5pt;
            color: #b42318;
            margin-left: 1.5mm;
        }

        .special {
            margin-top: 0.6mm;
            font-size: 6.8pt;
            color: #6b6790;
        }

        .detail {
            margin-top: 1.4mm;
            font-size: 7pt;
            color: #4a4670;
        }

        .detail b {
            color: #2a2550;
        }

        .dot {
            display: inline-block;
            width: 2.2mm;
            height: 2.2mm;
            margin-right: 0.6mm;
            border: 0.2mm solid #b9b5cc;
            border-radius: 1.2mm;
        }

        .desc {
            margin-top: 1.6mm;
            font-size: 6.8pt;
            line-height: 1.35;
            color: #6b6790;
        }

        /* ---------------------------------------------------- contacto */
        .contact-page {
            page-break-before: always;
            padding-top: 55mm;
            text-align: center;
        }

        .contact-title {
            font-family: "Playfair Display", serif;
            font-weight: bold;
            font-size: 26pt;
            color: #2a2550;
        }

        .contact-rule {
            width: 28mm;
            height: 0.8mm;
            margin: 6mm auto 10mm auto;
            background-color: #6c47ff;
        }

        .contact-line {
            margin-bottom: 4.5mm;
            font-size: 11pt;
            color: #2a2550;
        }

        .contact-line .label {
            display: block;
            margin-bottom: 0.8mm;
            font-size: 7pt;
            letter-spacing: 1.2pt;
            color: #8a86a0;
        }

        .contact-tagline {
            margin-top: 14mm;
            font-family: "Playfair Display", serif;
            font-size: 13pt;
            color: #6c47ff;
        }

        .empty {
            padding-top: 40mm;
            text-align: center;
            font-family: "Playfair Display", serif;
            font-size: 14pt;
            color: #6b6790;
        }
    </style>
</head>

<body>

    <!-- ===================== PORTADA ===================== -->
    <div class="cover">
        <div class="cover-inner">
            <img class="cover-logo" th:if="${logo != null}" th:src="${logo}" alt="" />
            <div class="cover-rule"></div>
            <div class="cover-title" th:text="${data.title}">Catálogo</div>
            <div class="cover-scope" th:if="${!#strings.isEmpty(data.scope)}" th:text="${data.scope}"></div>
            <div class="cover-date" th:text="${#temporals.format(data.generatedOn, 'dd/MM/yyyy')}"></div>
        </div>
        <div class="cover-contact">
            <div class="tagline" th:if="${!#strings.isEmpty(data.store.tagline)}" th:text="${data.store.tagline}"></div>
            <div th:if="${!#strings.isEmpty(data.store.whatsapp)}" th:text="'WhatsApp ' + ${data.store.whatsapp}"></div>
            <div th:if="${!#strings.isEmpty(data.store.instagram)}" th:text="'Instagram ' + ${data.store.instagram}"></div>
        </div>
    </div>

    <!-- ===================== PRODUCTOS ===================== -->
    <div class="empty" th:if="${data.empty}" th:text="#{brochure.empty}"></div>

    <th:block th:each="section : ${data.sections}">
        <div class="section">
            <div class="section-title" th:if="${!#strings.isEmpty(section.title)}"
                th:classappend="${section.highlight} ? 'is-new' : ''" th:text="${section.title}"></div>

            <table class="grid">
                <tr class="grid-row" th:each="row : ${section.rows(3)}">
                    <td class="cell" th:each="item : ${row}">
                        <div class="card" th:if="${item != null}">

                            <img class="photo" th:if="${!item.photos.isEmpty() and mainImages.containsKey(item.photos[0])}"
                                th:src="${mainImages.get(item.photos[0])}" alt="" />
                            <div class="photo-empty"
                                th:unless="${!item.photos.isEmpty() and mainImages.containsKey(item.photos[0])}"></div>

                            <div class="thumbs" th:if="${item.photos.size() > 1}">
                                <th:block th:each="extra : ${item.photos.subList(1, item.photos.size())}">
                                    <img class="thumb" th:if="${thumbImages.containsKey(extra)}"
                                        th:src="${thumbImages.get(extra)}" alt="" />
                                </th:block>
                            </div>

                            <div class="badges">
                                <span class="badge" th:if="${item.isNew}" th:text="#{brochure.badge.new}"></span>
                                <span class="badge is-request" th:if="${item.onRequest}"
                                    th:text="#{brochure.badge.onRequest}"></span>
                                <span class="badge is-soldout" th:if="${item.soldOut}"
                                    th:text="#{brochure.badge.soldOut}"></span>
                            </div>

                            <div class="name" th:text="${item.name}"></div>
                            <div class="code" th:if="${item.code != null}" th:text="${item.code}"></div>

                            <div th:if="${data.options.prices and item.price != null}">
                                <div class="price">
                                    <span class="old" th:if="${item.hasDiscount}"
                                        th:text="'$' + ${#numbers.formatDecimal(item.price, 1, 'COMMA', 2, 'POINT')}"></span>
                                    <span th:text="'$' + ${#numbers.formatDecimal(item.finalPrice, 1, 'COMMA', 2, 'POINT')}"></span>
                                    <span class="off" th:if="${item.hasDiscount}"
                                        th:text="'-' + ${item.discountPercent} + '%'"></span>
                                </div>
                                <div class="special" th:each="sp : ${item.specialPrices}"
                                    th:text="${sp.size} + ': $' + ${#numbers.formatDecimal(sp.price, 1, 'COMMA', 2, 'POINT')}">
                                </div>
                            </div>

                            <div class="detail" th:if="${data.options.sizes and !item.sizes.isEmpty()}">
                                <b th:text="#{brochure.pdf.sizes} + ':'"></b>
                                <span th:text="${#strings.listJoin(item.sizes, ' · ')}"></span>
                            </div>

                            <div class="detail" th:if="${data.options.colors and !item.colors.isEmpty()}">
                                <th:block th:each="c : ${item.colors}">
                                    <span class="dot" th:if="${c.hex != null}"
                                        th:style="'background-color:' + ${c.hex}"></span>
                                </th:block>
                                <span th:text="${#strings.listJoin(item.colors.![name], ', ')}"></span>
                            </div>

                            <div class="desc" th:if="${data.options.desc and item.description != null}"
                                th:text="${item.summary(130)}"></div>
                        </div>
                    </td>
                </tr>
            </table>
        </div>
    </th:block>

    <!-- ===================== CONTACTO ===================== -->
    <div class="contact-page" th:if="${data.hasContact}">
        <div class="contact-title" th:text="${data.store.storeName}"></div>
        <div class="contact-rule"></div>

        <div class="contact-line" th:if="${!#strings.isEmpty(data.store.whatsapp)}">
            <span class="label">WHATSAPP</span><span th:text="${data.store.whatsapp}"></span>
        </div>
        <div class="contact-line" th:if="${!#strings.isEmpty(data.store.phone)}">
            <span class="label" th:text="#{brochure.contact.phone}"></span><span th:text="${data.store.phone}"></span>
        </div>
        <div class="contact-line" th:if="${!#strings.isEmpty(data.store.email)}">
            <span class="label" th:text="#{brochure.contact.email}"></span><span th:text="${data.store.email}"></span>
        </div>
        <div class="contact-line" th:if="${!#strings.isEmpty(data.store.instagram)}">
            <span class="label">INSTAGRAM</span><span th:text="${data.store.instagram}"></span>
        </div>
        <div class="contact-line" th:if="${!#strings.isEmpty(data.store.facebook)}">
            <span class="label">FACEBOOK</span><span th:text="${data.store.facebook}"></span>
        </div>
        <div class="contact-line" th:if="${!#strings.isEmpty(data.store.address)}">
            <span class="label" th:text="#{brochure.contact.address}"></span><span th:text="${data.store.address}"></span>
        </div>

        <div class="contact-tagline" th:if="${!#strings.isEmpty(data.store.tagline)}" th:text="${data.store.tagline}"></div>
    </div>

</body>

</html>
