<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${data.title} + ' · ' + ${data.store.storeName}">Catálogo</title>
    <meta name="description" th:content="${data.store.tagline != null and !data.store.tagline.isBlank()} ? ${data.store.tagline} : ${data.store.storeName}">
    <meta property="og:type" content="website">
    <meta property="og:title" th:content="${data.title} + ' · ' + ${data.store.storeName}">
    <meta property="og:url" th:content="${pageUrl}">
    <meta property="og:image" th:if="${!data.sections.isEmpty() and !data.sections[0].items.isEmpty() and !data.sections[0].items[0].photos.isEmpty()}"
        th:content="${data.sections[0].items[0].photos[0]}">
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" th:href="@{/css/brochure.css}">
</head>

<body>
    <header class="bro-cover">
        <img class="bro-logo" th:src="@{/images/logo.png}" th:alt="${data.store.storeName}">
        <h1 th:text="${data.title}">Catálogo</h1>
        <p class="bro-scope" th:if="${!#strings.isEmpty(data.scope)}" th:text="${data.scope}"></p>
        <p class="bro-tagline" th:if="${!#strings.isEmpty(data.store.tagline)}" th:text="${data.store.tagline}"></p>
        <a class="bro-button" th:href="@{/catalogo.pdf{q}(q=${query})}" th:text="#{brochure.public.download}"></a>
    </header>

    <main class="bro-main">
        <p class="bro-empty" th:if="${data.empty}" th:text="#{brochure.empty}"></p>

        <section class="bro-section" th:each="section : ${data.sections}">
            <h2 th:if="${!#strings.isEmpty(section.title)}" th:classappend="${section.highlight} ? 'is-new' : ''"
                th:text="${section.title}"></h2>

            <div class="bro-grid">
                <article class="bro-card" th:each="item : ${section.items}" th:id="${item.code}">

                    <!-- Fotos: se deslizan de lado en el celular (sin JavaScript) -->
                    <div class="bro-photos" th:classappend="${item.photos.isEmpty()} ? 'is-empty' : ''">
                        <img th:each="photo : ${item.photos}" th:src="${photo}" th:alt="${item.name}" loading="lazy">
                        <span class="bro-flag" th:if="${item.isNew}" th:text="#{brochure.badge.new}"></span>
                    </div>

                    <div class="bro-body">
                        <h3 th:text="${item.name}"></h3>
                        <p class="bro-code" th:if="${item.code != null}" th:text="${item.code}"></p>

                        <p class="bro-state is-request" th:if="${item.onRequest}" th:text="#{brochure.badge.onRequest}"></p>
                        <p class="bro-state is-soldout" th:if="${item.soldOut}" th:text="#{brochure.badge.soldOut}"></p>

                        <div class="bro-price" th:if="${data.options.prices and item.price != null}">
                            <s th:if="${item.hasDiscount}"
                                th:text="'$' + ${#numbers.formatDecimal(item.price, 1, 'COMMA', 2, 'POINT')}"></s>
                            <b th:text="'$' + ${#numbers.formatDecimal(item.finalPrice, 1, 'COMMA', 2, 'POINT')}"></b>
                            <em th:if="${item.hasDiscount}" th:text="'-' + ${item.discountPercent} + '%'"></em>
                            <small th:each="sp : ${item.specialPrices}"
                                th:text="${sp.size} + ': $' + ${#numbers.formatDecimal(sp.price, 1, 'COMMA', 2, 'POINT')}"></small>
                        </div>

                        <p class="bro-line" th:if="${data.options.sizes and !item.sizes.isEmpty()}">
                            <span th:text="#{brochure.pdf.sizes}"></span>
                            <b th:text="${#strings.listJoin(item.sizes, ' · ')}"></b>
                        </p>

                        <p class="bro-colors" th:if="${data.options.colors and !item.colors.isEmpty()}">
                            <span class="bro-color" th:each="c : ${item.colors}">
                                <i th:if="${c.hex != null}" th:style="'background-color:' + ${c.hex}"></i>
                                <span th:text="${c.name}"></span>
                            </span>
                        </p>

                        <p class="bro-desc" th:if="${data.options.desc and item.description != null}"
                            th:text="${item.description}"></p>

                        <a class="bro-ask" th:if="${item.whatsappUrl != null and !item.soldOut}" th:href="${item.whatsappUrl}"
                            target="_blank" rel="noopener" th:text="#{brochure.public.ask}"></a>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <footer class="bro-footer" th:if="${data.hasContact}">
        <h2 th:text="${data.store.storeName}"></h2>
        <p th:if="${!#strings.isEmpty(data.store.whatsapp)}">WhatsApp: <span th:text="${data.store.whatsapp}"></span></p>
        <p th:if="${!#strings.isEmpty(data.store.phone)}"><span th:text="#{brochure.contact.phone}"></span>: <span th:text="${data.store.phone}"></span></p>
        <p th:if="${!#strings.isEmpty(data.store.email)}"><span th:text="${data.store.email}"></span></p>
        <p th:if="${!#strings.isEmpty(data.store.instagram)}">Instagram: <span th:text="${data.store.instagram}"></span></p>
        <p th:if="${!#strings.isEmpty(data.store.facebook)}">Facebook: <span th:text="${data.store.facebook}"></span></p>
        <p th:if="${!#strings.isEmpty(data.store.address)}"><span th:text="${data.store.address}"></span></p>
    </footer>
</body>

</html>
