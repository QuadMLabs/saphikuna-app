<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos - Saphikuna</title>

    <link rel="stylesheet" th:href="@{/css/admin.css}">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <div class="admin-layout">

        <!-- Sidebar -->
        <aside th:replace="~{fragments/admin-sidebar :: sidebar}"></aside>

        <!-- Main -->
        <main class="admin-main">

            <!-- Topbar -->
            <header th:replace="~{fragments/admin-topbar :: topbar}"></header>

            <!-- Content -->
            <section class="admin-content">

                <!-- Page header -->
                <div class="page-header">

                    <h1 class="page-title" th:text="#{products.title}">
                        Productos
                    </h1>

                    <p class="page-subtitle" th:text="#{products.subtitle}">
                        Administra los productos registrados.
                    </p>

                </div>


                <!-- Products table -->
                <div class="content-surface">

                    <div class="table-header">

                        <div class="table-controls-left">

                            <div class="table-length">
                                <label for="pageSize" th:text="#{table.show}">
                                    Mostrar
                                </label>

                                <select id="pageSize" class="table-select">
                                    <option value="10">10</option>
                                    <option value="25">25</option>
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                </select>

                                <span th:text="#{table.records}">
                                    registros
                                </span>
                            </div>

                        </div>


                        <div class="table-controls-right">

                            <div class="table-search">

                                <label for="tableSearch" th:text="#{table.search}">
                                    Buscar:
                                </label>

                                <div class="table-search-input">

                                    <i data-lucide="search"></i>

                                    <input type="search" id="tableSearch" th:placeholder="#{table.search.placeholder}">

                                </div>

                            </div>


                            <button type="button" class="secondary-button" th:if="${showFilters}">

                                <i data-lucide="filter"></i>

                                <span th:text="#{table.filters}">
                                    Filtros
                                </span>

                            </button>


                            <button type="button" class="primary-button">

                                <i data-lucide="plus"></i>

                                <span th:text="#{products.new}">
                                    Nuevo producto
                                </span>

                            </button>

                        </div>

                    </div>

                    <div class="table-filter-panel" th:if="${showFilters}">

                        <div class="table-filter-fields">

                            <div class="table-filter-field">

                                <label for="filterCategory">
                                    Categoría
                                </label>

                                <select id="filterCategory" class="table-filter-select" data-filter-column="category">

                                    <option value="">Todas</option>
                                    <option value="Tejidos">Tejidos</option>
                                    <option value="Accesorios">Accesorios</option>

                                </select>

                            </div>


                            <div class="table-filter-field">

                                <label for="filterStatus">
                                    Estado
                                </label>

                                <select id="filterStatus" class="table-filter-select" data-filter-column="status">

                                    <option value="">Todos</option>
                                    <option value="Activo">Activo</option>
                                    <option value="Inactivo">Inactivo</option>

                                </select>

                            </div>

                        </div>


                        <button type="button" id="clearTableFilters" class="secondary-button">

                            <i data-lucide="rotate-ccw"></i>

                            <span>Limpiar</span>

                        </button>

                    </div>


                    <div class="table-container">

                        <table class="data-table">

                            <thead>
                                <tr>

                                    <th data-column-type="image">Imagen</th>
                                    <th data-column-type="text">Producto</th>
                                    <th data-column-type="category">Categoría</th>
                                    <th data-column-type="tags">Tallas</th>
                                    <th data-column-type="colors">Colores</th>
                                    <th data-column-type="currency">Precio</th>
                                    <th data-column-type="status">Estado</th>
                                    <th data-column-type="actions">Acciones</th>

                                </tr>
                            </thead>


                            <tbody>

                                <tr>

                                    <!-- Imagen -->
                                    <td data-column-type="image">
                                        <button type="button" class="table-thumbnail-button" title="Ver imagen">

                                            <img src="/images/Comun_Saphikuna.png" alt="Chompa Andina"
                                                class="table-thumbnail">

                                        </button>
                                    </td>

                                    <!-- Producto -->
                                    <td data-column-type="text">
                                        Chompa Andina
                                    </td>

                                    <!-- Categoría -->
                                    <td data-column-type="category">
                                        Tejidos
                                    </td>

                                    <!-- Tallas -->
                                    <td data-column-type="tags">
                                        <div class="table-tags">

                                            <span class="table-tag">S</span>
                                            <span class="table-tag">M</span>
                                            <span class="table-tag">L</span>
                                            <span class="table-tag">XL</span>

                                        </div>
                                    </td>

                                    <!-- Colores -->
                                    <td data-column-type="colors">
                                        <div class="table-colors">

                                            <span class="table-color" title="Rojo" style="background-color: #c62828;">
                                            </span>

                                            <span class="table-color" title="Azul" style="background-color: #1565c0;">
                                            </span>

                                            <span class="table-color" title="Negro" style="background-color: #212121;">
                                            </span>

                                        </div>
                                    </td>

                                    <!-- Precio -->
                                    <td data-column-type="currency">
                                        $45.00
                                    </td>

                                    <!-- Estado -->
                                    <td data-column-type="status">
                                        <span class="status-badge status-active">
                                            Activo
                                        </span>
                                    </td>

                                    <!-- Acciones -->
                                    <td data-column-type="actions" class="table-actions">

                                        <button type="button" class="table-action-button" title="Editar">
                                            <i data-lucide="pencil"></i>
                                        </button>

                                        <button type="button" class="table-action-button" title="Eliminar">
                                            <i data-lucide="trash-2"></i>
                                        </button>

                                    </td>

                                </tr>

                                <tr>

                                    <!-- Imagen -->
                                    <td data-column-type="image">
                                        <button type="button" class="table-thumbnail-button" title="Ver imagen">

                                            <img src="/images/Comun_Saphikuna.png" alt="Chompa Andina"
                                                class="table-thumbnail">

                                        </button>
                                    </td>

                                    <!-- Producto -->
                                    <td data-column-type="text">
                                        Chompa Andina
                                    </td>

                                    <!-- Categoría -->
                                    <td data-column-type="category">
                                        Tejidos
                                    </td>

                                    <!-- Tallas -->
                                    <td data-column-type="tags">
                                        <div class="table-tags">

                                            <span class="table-tag">S</span>
                                            <span class="table-tag">M</span>
                                            <span class="table-tag">L</span>
                                            <span class="table-tag">XL</span>

                                        </div>
                                    </td>

                                    <!-- Colores -->
                                    <td data-column-type="colors">
                                        <div class="table-colors">

                                            <span class="table-color" title="Rojo" style="background-color: #c62828;">
                                            </span>

                                            <span class="table-color" title="Azul" style="background-color: #1565c0;">
                                            </span>

                                            <span class="table-color" title="Negro" style="background-color: #212121;">
                                            </span>

                                        </div>
                                    </td>

                                    <!-- Precio -->
                                    <td data-column-type="currency">
                                        $45.00
                                    </td>

                                    <!-- Estado -->
                                    <td data-column-type="status">
                                        <span class="status-badge status-active">
                                            Activo
                                        </span>
                                    </td>

                                    <!-- Acciones -->
                                    <td data-column-type="actions" class="table-actions">

                                        <button type="button" class="table-action-button" title="Editar">
                                            <i data-lucide="pencil"></i>
                                        </button>

                                        <button type="button" class="table-action-button" title="Eliminar">
                                            <i data-lucide="trash-2"></i>
                                        </button>

                                    </td>

                                </tr>



                            </tbody>

                        </table>


                    </div>

                    <div class="table-footer">

                        <div class="table-info">
                            Mostrando <span id="tableVisibleCount">10</span>
                            de <span id="tableTotalCount">12</span>
                            elementos
                        </div>

                        <div class="table-pagination">

                            <button type="button" class="pagination-button" data-page="previous"
                                aria-label="Página anterior">

                                <i data-lucide="chevron-left"></i>

                            </button>

                            <div id="paginationPages"></div>

                            <button type="button" class="pagination-button" data-page="next"
                                aria-label="Página siguiente">

                                <i data-lucide="chevron-right"></i>

                            </button>

                        </div>

                    </div>

                </div>

                <div id="imageModal" class="image-modal">

                    <button type="button" id="imageModalClose" class="image-modal-close" aria-label="Cerrar">

                        <i data-lucide="x"></i>

                    </button>

                    <img id="imageModalImage" class="image-modal-image" src="" alt="">

                </div>
            </section>

        </main>

    </div>


    <script th:src="@{/js/admin.js}"></script>

    <script>
        lucide.createIcons();
    </script>

</body>

</html>
