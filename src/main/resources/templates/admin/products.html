<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin-head :: head(#{products.title})}"></head>

<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside th:replace="~{fragments/admin-sidebar :: sidebar}"></aside>
        <!-- Main -->
        <main class="admin-main">
            <!-- Topbar -->
            <header th:replace="~{fragments/admin-topbar :: topbar}"></header>
            <!-- Content -->
            <section class="admin-content">
                <!-- Page header -->
                <div class="page-header">
                    <h1 class="page-title" th:text="#{products.title}"></h1>
                    <p class="page-subtitle" th:text="#{products.subtitle}"></p>
                </div>
                <!-- Products table -->
                <div class="content-surface">
                    <div class="table-header">
                        <!-- Show ...records table -->
                        <div class="table-controls-left">
                            <div class="table-length">
                                <label for="pageSize" th:text="#{table.show}"></label>
                                <select id="pageSize" class="table-select">
                                    <option value="10">10</option>
                                    <option value="25">25</option>
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                </select>
                                <span th:text="#{table.records}"></span>
                            </div>
                        </div>
                        <!-- Left elements table -->
                        <div class="table-controls-right">
                            <!-- Search table -->
                            <div class="table-search">
                                <label for="tableSearch" th:text="#{common.search}"></label>
                                <div class="table-search-input">
                                    <i data-lucide="search"></i>
                                    <input type="search" id="tableSearch" th:placeholder="#{table.search.placeholder}">
                                </div>
                            </div>
                            <!-- Filter table -->
                            <button type="button" id="toggleTableFilters" class="secondary-button">
                                <i data-lucide="sliders-horizontal"></i>
                                <span th:text="#{table.filters}"></span>
                            </button>
                            <!-- Add product table -->
                            <button type="button" class="primary-button">
                                <i data-lucide="plus"></i>
                                <span th:text="#{products.new}"></span>
                            </button>
                        </div>
                    </div>
                    <!-- FILTERS TABLE -->
                    <div class="table-filter-panel" th:if="${showFilters}">
                        <div class="table-filter-fields">
                            <!-- Category filter -->
                            <div class="table-filter-field">
                                <label for="filterCategory" th:text="#{products.category}"></label>
                                <select id="filterCategory" class="table-filter-select" data-filter-column="category">
                                    <option value="">Todas</option>
                                    <option value="Tejidos">Tejidos</option>
                                    <option value="Accesorios">Accesorios</option>
                                </select>
                            </div>
                            <!-- Status filter -->
                            <div class="table-filter-field">
                                <label for="filterStatus" th:text="#{products.status}"></label>
                                <select id="filterStatus" class="table-filter-select" data-filter-column="status">
                                    <option value="">Todos</option>
                                    <option value="Activo">Activo</option>
                                    <option value="Inactivo">Inactivo</option>
                                </select>
                            </div>
                            <!-- Size filter -->
                            <div class="table-filter-field">
                                <label for="filterStatus" th:text="#{products.size}"></label>
                                <div class="table-multi-filter" id="filterTags" data-filter-column="tags"
                                    data-filter-match="multi">
                                    <button type="button" class="table-multi-filter-button">
                                        <span class="table-multi-filter-label" th:text="#{common.all}"></span>
                                        <i data-lucide="chevron-down"></i>
                                    </button>
                                    <div class="table-multi-filter-options">
                                        <label class="table-multi-filter-option">
                                            <input type="checkbox" value="S">
                                            <span>S</span>
                                        </label>
                                        <label class="table-multi-filter-option">
                                            <input type="checkbox" value="M">
                                            <span>M</span>
                                        </label>
                                        <label class="table-multi-filter-option">
                                            <input type="checkbox" value="L">
                                            <span>L</span>
                                        </label>
                                        <label class="table-multi-filter-option">
                                            <input type="checkbox" value="XL">
                                            <span>XL</span>
                                        </label>
                                        <label class="table-multi-filter-option">
                                            <input type="checkbox" value="XXL">
                                            <span>XXL</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Clear filter -->
                        <button type="button" id="clearTableFilters" class="secondary-button">
                            <i data-lucide="rotate-ccw"></i>
                            <span th:text="#{common.clear}"></span>
                        </button>
                    </div>
                    <!-- DATA TABLE-->
                    <div class="table-container">
                        <table class="data-table"
                            th:attr="data-empty-message=#{products.table.empty}, data-empty-filtered-message=#{products.table.empty.filtered}">
                            <thead>
                                <tr>
                                    <th th:text="#{products.table.column.image}" data-column-type="image"></th>
                                    <th th:text="#{products.table.column.name}" data-column-type="text"></th>
                                    <th th:text="#{products.table.column.category}" data-column-type="category"></th>
                                    <th th:text="#{products.table.column.sizes}" data-column-type="tags"></th>
                                    <th th:text="#{products.table.column.colors}" data-column-type="colors"></th>
                                    <th th:text="#{products.table.column.price}" data-column-type="currency"></th>
                                    <th th:text="#{products.table.column.status}" data-column-type="status"></th>
                                    <th th:text="#{products.table.column.actions}" data-column-type="actions"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <!-- Imagen -->
                                    <td data-column-type="image">
                                        <button type="button" class="table-thumbnail-button"
                                            th:title="#{products.table.column.image.show}">
                                            <img src="/images/Comun_Saphikuna.png" class="table-thumbnail">
                                        </button>
                                    </td>
                                    <!-- Producto -->
                                    <td data-column-type="text">
                                        Chompa Andina
                                    </td>
                                    <!-- Categoría -->
                                    <td data-column-type="category">
                                        Tejidos
                                    </td>
                                    <!-- Tallas -->
                                    <td data-column-type="tags">
                                        <div class="table-tags">
                                            <span class="table-tag">S</span>
                                            <span class="table-tag">M</span>
                                            <span class="table-tag">L</span>
                                            <span class="table-tag">XL</span>
                                        </div>
                                    </td>
                                    <!-- Colores -->
                                    <td data-column-type="colors">
                                        <div class="table-colors">
                                            <span class="table-color" title="Rojo" style="background-color: #c62828;">
                                            </span>
                                            <span class="table-color" title="Azul" style="background-color: #1565c0;">
                                            </span>
                                            <span class="table-color" title="Negro" style="background-color: #212121;">
                                            </span>
                                        </div>
                                    </td>
                                    <!-- Precio -->
                                    <td data-column-type="currency">
                                        $45.00
                                    </td>
                                    <!-- Estado -->
                                    <td data-column-type="status">
                                        <span class="status-badge status-active">
                                            Activo
                                        </span>
                                    </td>
                                    <!-- Acciones -->
                                    <td data-column-type="actions" class="table-actions">
                                        <button type="button" class="table-action-button" th:title="#{common.edit}">
                                            <i data-lucide="pencil"></i>
                                        </button>
                                        <button type="button" class="table-action-button" th:title="#{common.delete}">
                                            <i data-lucide="trash-2"></i>
                                        </button>
                                    </td>
                                </tr>
                                <tr>
                                    <!-- Imagen -->
                                    <td data-column-type="image">
                                        <button type="button" class="table-thumbnail-button" title="Ver imagen">
                                            <img src="/images/Comun_Saphikuna.png" alt="Chompa Andina"
                                                class="table-thumbnail">
                                        </button>
                                    </td>
                                    <!-- Producto -->
                                    <td data-column-type="text">
                                        Chompa Andina
                                    </td>
                                    <!-- Categoría -->
                                    <td data-column-type="category">
                                        Tejidos
                                    </td>
                                    <!-- Tallas -->
                                    <td data-column-type="tags">
                                        <div class="table-tags">
                                            <span class="table-tag">L</span>
                                        </div>
                                    </td>
                                    <!-- Colores -->
                                    <td data-column-type="colors">
                                        <div class="table-colors">
                                            <span class="table-color" title="Rojo" style="background-color: #c62828;">
                                            </span>
                                            <span class="table-color" title="Azul" style="background-color: #1565c0;">
                                            </span>
                                            <span class="table-color" title="Negro" style="background-color: #212121;">
                                            </span>
                                        </div>
                                    </td>
                                    <!-- Precio -->
                                    <td data-column-type="currency">
                                        $45.00
                                    </td>
                                    <!-- Estado -->
                                    <td data-column-type="status">
                                        <span class="status-badge status-active">
                                            Activo
                                        </span>
                                    </td>
                                    <!-- Acciones -->
                                    <td data-column-type="actions" class="table-actions">
                                        <button type="button" class="table-action-button" title="Editar">
                                            <i data-lucide="pencil"></i>
                                        </button>
                                        <button type="button" class="table-action-button" title="Eliminar">
                                            <i data-lucide="trash-2"></i>
                                        </button>
                                    </td>
                                </tr>
                                <!-- RESULTADOS NULOS -->
                                <tr id="tableEmptyState" class="table-empty-state" style="display: none;">
                                    <td colspan="100%">
                                        <div class="table-empty-message">
                                            <i data-lucide="inbox"></i>
                                            <span id="tableEmptyMessage"></span>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="table-footer">
                        <div class="table-info">
                            <span th:text="#{table.showing}">Mostrando</span>
                            <span id="tableVisibleCount">10</span>
                            <span th:text="#{table.of}">de</span>
                            <span id="tableTotalCount">12</span>
                            <span th:text="#{table.items}">elementos</span>
                        </div>
                        <div class="table-pagination">
                            <button type="button" class="pagination-button" data-page="previous"
                                th:attr="aria-label=#{table.pagination.previous}">
                                <i data-lucide="chevron-left"></i>
                            </button>
                            <div id="paginationPages"></div>
                            <button type="button" class="pagination-button" data-page="next"
                                th:attr="aria-label=#{table.pagination.next}">
                                <i data-lucide="chevron-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div id="imageModal" class="image-modal">
                    <button type="button" id="imageModalClose" class="image-modal-close" aria-label="Cerrar">
                        <i data-lucide="x"></i>
                    </button>
                    <img id="imageModalImage" class="image-modal-image" src="" alt="">
                </div>
            </section>
            <!-- Footer -->
            <footer th:replace="~{fragments/admin-footer :: footer}"></footer>
        </main>
    </div>
    <script th:src="@{/js/admin.js}"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
