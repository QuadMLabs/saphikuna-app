<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin-head :: head(title=${pieceId != null ? #messages.msg('collab.piece.form.title.edit') : #messages.msg('collab.piece.form.title')}, additionalStyles=~{::css_exclusivo})}">
    <th:block th:fragment="css_exclusivo">
        <link rel="stylesheet" th:href="@{/css/products/products.css}">
        <link rel="stylesheet" th:href="@{/css/collaborations.css}">
    </th:block>
</head>

<body>
    <div class="admin-layout">
        <aside th:replace="~{fragments/admin-sidebar :: sidebar}"></aside>
        <main class="admin-main">
            <header th:replace="~{fragments/admin-topbar :: topbar}"></header>
            <section class="admin-content">

                <form class="general-form collab-form" method="post" enctype="multipart/form-data" data-saving
                    th:object="${pieceForm}"
                    th:action="${pieceId == null} ? @{/admin/colaboraciones/{id}/prendas(id=${brandId})} : @{/admin/colaboraciones/prendas/{id}(id=${pieceId})}">

                    <div class="general-form-header">
                        <div>
                            <h1 class="general-form-title"
                                th:text="${pieceId != null} ? #{collab.piece.form.title.edit} : #{collab.piece.form.title}"></h1>
                            <p class="general-form-subtitle" th:text="#{collab.piece.form.subtitle(${brandName})}"></p>
                        </div>
                    </div>

                    <div class="flash flash-error" role="alert" th:if="${#fields.hasGlobalErrors()}">
                        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                    </div>

                    <!-- FOTOS -->
                    <div class="general-card card-photos">
                        <div class="general-card-header">
                            <h3 th:text="#{collab.piece.section.photos}"></h3>
                        </div>
                        <div class="general-card-body">
                            <p class="field-hint" th:text="#{collab.piece.photos.hint(${maxImages})}"></p>

                            <div class="photo-grid" id="photoGrid">
                                <!-- Fotos ya guardadas -->
                                <div class="photo-card" data-existing th:each="img, st : *{images}">
                                    <input type="hidden" th:field="*{images[__${st.index}__].id}">
                                    <img th:src="${img.thumbUrl}" alt="" loading="lazy">

                                    <!-- ★ principal -->
                                    <label class="photo-btn photo-star" th:title="#{products.form.images.primary.set}">
                                        <input type="radio" class="visually-hidden" name="primary"
                                            th:value="'existing:' + ${img.id}"
                                            th:checked="${pieceForm.primary == 'existing:' + img.id}"
                                            th:aria-label="#{products.form.images.primary.set}">
                                        <svg viewBox="0 0 24 24" aria-hidden="true">
                                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                                        </svg>
                                    </label>

                                    <!-- ✕ quitar (se aplica al guardar) -->
                                    <label class="photo-btn photo-x" th:title="#{products.form.images.remove}">
                                        <input type="checkbox" class="visually-hidden"
                                            th:name="|images[${st.index}].delete|" value="true"
                                            th:checked="${img.delete}"
                                            th:aria-label="#{products.form.images.remove}">
                                        <svg viewBox="0 0 24 24" aria-hidden="true">
                                            <path d="M18 6 6 18" />
                                            <path d="m6 6 12 12" />
                                        </svg>
                                    </label>

                                    <span class="photo-removed-note" th:text="#{products.form.images.removed.note}"></span>
                                </div>

                                <!-- Vista previa de las fotos nuevas (la arma product-photos.js) -->
                                <div class="photo-previews" id="photoPreviews"
                                    th:attr="data-primary-label=#{products.form.images.primary.set},data-remove-label=#{products.form.images.remove}"></div>

                                <!-- Botón para agregar: en el celular abre cámara o galería -->
                                <label class="photo-add" for="newImages" id="photoAdd">
                                    <i data-lucide="image-plus"></i>
                                    <span th:text="#{products.form.section.images.add}"></span>
                                </label>
                            </div>

                            <input type="file" id="newImages" class="visually-hidden" name="newImages"
                                accept="image/*" multiple th:attr="data-max=${maxImages},data-max-message=#{collab.piece.validation.images.max}">
                            <p class="field-hint" id="photoMessage" role="status"></p>
                            <p class="form-field-error" th:if="${#fields.hasErrors('newImages')}"
                                th:errors="*{newImages}"></p>
                        </div>
                    </div>

                    <div th:replace="~{fragments/admin-video :: video-field}"></div>

                    <!-- INFORMACIÓN -->
                    <div class="general-card">
                        <div class="general-card-header">
                            <h3 th:text="#{collab.piece.section.info}"></h3>
                        </div>
                        <div class="general-card-body">
                            <div class="form-field" th:classappend="${#fields.hasErrors('name')} ? 'has-error' : ''">
                                <label for="name">
                                    <span th:text="#{collab.piece.field.name}"></span>
                                    <span class="required-mark">*</span>
                                </label>
                                <input type="text" id="name" th:field="*{name}" class="form-input" maxlength="150"
                                    autocomplete="off" th:placeholder="#{collab.piece.field.name.ph}">
                                <p class="form-field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                            </div>

                            <div class="form-field" th:classappend="${#fields.hasErrors('description')} ? 'has-error' : ''">
                                <label for="description" th:text="#{collab.piece.field.description}"></label>
                                <textarea id="description" th:field="*{description}" class="form-input" rows="4"
                                    maxlength="1000" th:placeholder="#{collab.piece.field.description.ph}"></textarea>
                                <p class="form-field-error" th:if="${#fields.hasErrors('description')}"
                                    th:errors="*{description}"></p>
                            </div>
                        </div>
                    </div>

                    <!-- COLORES -->
                    <div class="general-card">
                        <div class="general-card-header">
                            <h3 th:text="#{collab.piece.section.colors}"></h3>
                        </div>
                        <div class="general-card-body">
                            <div class="chip-group">
                                <label class="chip" th:each="color : ${colors}">
                                    <input type="checkbox" name="colorIds" th:value="${color.colorId}"
                                        th:checked="${#lists.contains(pieceForm.colorIds, color.colorId)}">
                                    <span>
                                        <i class="color-dot" th:style="'background:' + ${color.hexCode}"></i>
                                        <b th:text="${color.name}" style="font-weight: inherit;"></b>
                                    </span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions-bar">
                        <a th:href="@{/admin/colaboraciones}" class="secondary-button" th:text="#{common.cancel}"></a>
                        <button type="submit" class="primary-button" data-saving-button
                            th:attr="data-saving-text=#{common.saving}" th:text="#{common.save}"></button>
                    </div>
                </form>
            </section>
            <footer th:replace="~{fragments/admin-footer :: footer}"></footer>
        </main>
    </div>
    <th:block th:replace="~{fragments/admin-scripts :: global-scripts(~{::scripts_colab})}">
        <th:block th:fragment="scripts_colab">
            <script th:src="@{/js/product-photos.js}"></script>
            <script th:src="@{/js/video-field.js}"></script>
            <script th:src="@{/js/form-saving.js}"></script>
        </th:block>
    </th:block>
</body>

</html>
