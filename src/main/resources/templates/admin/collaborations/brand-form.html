<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin-head :: head(title=${brandId != null ? #messages.msg('collab.brand.form.title.edit') : #messages.msg('collab.brand.form.title')}, additionalStyles=~{::css_exclusivo})}">
    <th:block th:fragment="css_exclusivo">
        <link rel="stylesheet" th:href="@{/css/products/products.css}">
        <link rel="stylesheet" th:href="@{/css/collaborations.css}">
    </th:block>
</head>

<body>
    <div class="admin-layout">
        <aside th:replace="~{fragments/admin-sidebar :: sidebar}"></aside>
        <main class="admin-main">
            <header th:replace="~{fragments/admin-topbar :: topbar}"></header>
            <section class="admin-content">

                <form class="general-form collab-form" method="post" data-saving th:object="${brandForm}"
                    th:action="${brandId == null} ? @{/admin/colaboraciones} : @{/admin/colaboraciones/{id}(id=${brandId})}">

                    <div class="general-form-header">
                        <div>
                            <h1 class="general-form-title"
                                th:text="${brandId != null} ? #{collab.brand.form.title.edit} : #{collab.brand.form.title}"></h1>
                            <p class="general-form-subtitle" th:text="#{collab.brand.form.subtitle}"></p>
                        </div>
                    </div>

                    <div class="flash flash-error" role="alert" th:if="${#fields.hasGlobalErrors()}">
                        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                    </div>

                    <div class="general-card">
                        <div class="general-card-body">
                            <div class="form-field" th:classappend="${#fields.hasErrors('brandName')} ? 'has-error' : ''">
                                <label for="brandName">
                                    <span th:text="#{collab.brand.field.name}"></span>
                                    <span class="required-mark">*</span>
                                </label>
                                <input type="text" id="brandName" th:field="*{brandName}" class="form-input"
                                    maxlength="80" autocomplete="off" autofocus
                                    th:placeholder="#{collab.brand.field.name.ph}">
                                <p class="form-field-error" th:if="${#fields.hasErrors('brandName')}"
                                    th:errors="*{brandName}"></p>
                            </div>

                            <label class="collab-switch">
                                <input type="checkbox" name="visible" value="true" th:checked="*{visible}">
                                <span th:text="#{collab.brand.field.visible}"></span>
                            </label>
                        </div>
                    </div>

                    <div class="form-actions-bar">
                        <a th:href="@{/admin/colaboraciones}" class="secondary-button" th:text="#{common.cancel}"></a>
                        <button type="submit" class="primary-button" data-saving-button
                            th:attr="data-saving-text=#{common.saving}" th:text="#{common.save}"></button>
                    </div>
                </form>
            </section>
            <footer th:replace="~{fragments/admin-footer :: footer}"></footer>
        </main>
    </div>
    <th:block th:replace="~{fragments/admin-scripts :: global-scripts(~{::scripts_colab})}">
        <th:block th:fragment="scripts_colab">
            <script th:src="@{/js/form-saving.js}"></script>
        </th:block>
    </th:block>
</body>

</html>
