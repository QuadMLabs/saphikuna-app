<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin-head :: head(title=#{brochure.title}, additionalStyles=~{::css_exclusivo})}">
    <th:block th:fragment="css_exclusivo">
        <link rel="stylesheet" th:href="@{/css/products/products.css}">
        <link rel="stylesheet" th:href="@{/css/catalog.css}">
        <link rel="stylesheet" th:href="@{/css/settings.css}">
    </th:block>
</head>

<body>
    <div class="admin-layout">
        <aside th:replace="~{fragments/admin-sidebar :: sidebar}"></aside>
        <main class="admin-main">
            <header th:replace="~{fragments/admin-topbar :: topbar}"></header>
            <section class="admin-content settings-page">

                <div class="page-header">
                    <h1 class="page-title" th:text="#{brochure.title}"></h1>
                    <p class="page-subtitle" th:text="#{brochure.subtitle}"></p>
                </div>

                <!-- Opciones: formulario GET, así el resultado queda en la URL -->
                <form class="general-form settings-card" method="get" th:action="@{/admin/catalogo}">
                    <div class="general-card">
                        <div class="general-card-header">
                            <h3 th:text="#{brochure.section.options}"></h3>
                        </div>
                        <div class="general-card-body">

                            <div class="form-field">
                                <label for="title" th:text="#{brochure.field.title}"></label>
                                <input type="text" id="title" name="title" class="form-input" maxlength="60"
                                    th:value="${options.titleOrDefault()}" autocomplete="off">
                            </div>

                            <div class="field-row two">
                                <div class="form-field">
                                    <label for="category" th:text="#{brochure.field.category}"></label>
                                    <select id="category" name="category" class="form-input">
                                        <option value="" th:text="#{brochure.all}"></option>
                                        <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.name}"
                                            th:selected="${options.categoryId() != null and options.categoryId() == c.categoryId}"></option>
                                    </select>
                                </div>
                                <div class="form-field">
                                    <label for="collection" th:text="#{brochure.field.collection}"></label>
                                    <select id="collection" name="collection" class="form-input">
                                        <option value="" th:text="#{brochure.all}"></option>
                                        <option th:each="c : ${collections}" th:value="${c.collectionId}" th:text="${c.name}"
                                            th:selected="${options.collectionId() != null and options.collectionId() == c.collectionId}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="field-row two">
                                <div class="form-field">
                                    <label for="news" th:text="#{brochure.field.news}"></label>
                                    <select id="news" name="news" class="form-input">
                                        <option value="false" th:selected="${!options.news}" th:text="#{brochure.opt.allProducts}"></option>
                                        <option value="true" th:selected="${options.news}" th:text="#{brochure.opt.onlyNews}"></option>
                                    </select>
                                </div>
                                <div class="form-field">
                                    <label for="soldout" th:text="#{brochure.field.soldout}"></label>
                                    <select id="soldout" name="soldout" class="form-input">
                                        <option value="false" th:selected="${!options.soldout}" th:text="#{brochure.opt.hideSoldout}"></option>
                                        <option value="true" th:selected="${options.soldout}" th:text="#{brochure.opt.showSoldout}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="field-row two">
                                <div class="form-field">
                                    <label for="group" th:text="#{brochure.field.group}"></label>
                                    <select id="group" name="group" class="form-input">
                                        <option value="true" th:selected="${options.group}" th:text="#{brochure.opt.byCategory}"></option>
                                        <option value="false" th:selected="${!options.group}" th:text="#{brochure.opt.oneList}"></option>
                                    </select>
                                </div>
                                <div class="form-field">
                                    <label for="photos" th:text="#{brochure.field.photos}"></label>
                                    <select id="photos" name="photos" class="form-input">
                                        <option th:each="n : ${#numbers.sequence(1, 4)}" th:value="${n}" th:text="${n}"
                                            th:selected="${options.photoCount() == n}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="field-row two">
                                <div class="form-field">
                                    <label for="prices" th:text="#{brochure.field.prices}"></label>
                                    <select id="prices" name="prices" class="form-input">
                                        <option value="true" th:selected="${options.prices}" th:text="#{brochure.opt.show}"></option>
                                        <option value="false" th:selected="${!options.prices}" th:text="#{brochure.opt.hide}"></option>
                                    </select>
                                </div>
                                <div class="form-field">
                                    <label for="sizes" th:text="#{brochure.field.sizes}"></label>
                                    <select id="sizes" name="sizes" class="form-input">
                                        <option value="true" th:selected="${options.sizes}" th:text="#{brochure.opt.show}"></option>
                                        <option value="false" th:selected="${!options.sizes}" th:text="#{brochure.opt.hide}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="field-row two">
                                <div class="form-field">
                                    <label for="colors" th:text="#{brochure.field.colors}"></label>
                                    <select id="colors" name="colors" class="form-input">
                                        <option value="true" th:selected="${options.colors}" th:text="#{brochure.opt.show}"></option>
                                        <option value="false" th:selected="${!options.colors}" th:text="#{brochure.opt.hide}"></option>
                                    </select>
                                </div>
                                <div class="form-field">
                                    <label for="desc" th:text="#{brochure.field.desc}"></label>
                                    <select id="desc" name="desc" class="form-input">
                                        <option value="true" th:selected="${options.desc}" th:text="#{brochure.opt.show}"></option>
                                        <option value="false" th:selected="${!options.desc}" th:text="#{brochure.opt.hide}"></option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="settings-card-footer">
                            <button type="submit" class="primary-button" th:text="#{brochure.apply}"></button>
                        </div>
                    </div>
                </form>

                <!-- Resultado: cuántos productos entran y las dos salidas -->
                <div class="general-card settings-card">
                    <div class="general-card-header">
                        <h3 th:text="#{brochure.section.result}"></h3>
                    </div>
                    <div class="general-card-body">
                        <p th:if="${count == 0}" class="field-hint" th:text="#{brochure.empty}"></p>
                        <p th:if="${count > 0}">
                            <b th:text="#{brochure.count(${count})}"></b>
                            <span th:if="${!#strings.isEmpty(scope)}" th:text="' · ' + ${scope}"></span>
                        </p>

                        <div class="form-field">
                            <label for="publicUrl" th:text="#{brochure.link}"></label>
                            <input type="text" id="publicUrl" class="form-input" readonly th:value="${publicUrl}"
                                onfocus="this.select()">
                            <p class="form-field-hint" th:text="#{brochure.link.hint}"></p>
                        </div>
                    </div>
                    <div class="settings-card-footer">
                        <a class="primary-button" th:href="@{/catalogo{q}(q=${query})}" target="_blank" rel="noopener"
                            th:text="#{brochure.view}"></a>
                        <a class="primary-button" th:href="@{/catalogo.pdf{q}(q=${query})}" target="_blank" rel="noopener"
                            th:text="#{brochure.pdf}"></a>
                    </div>
                </div>
            </section>
            <footer th:replace="~{fragments/admin-footer :: footer}"></footer>
        </main>
    </div>
    <th:block th:replace="~{fragments/admin-scripts :: global-scripts(~{::scripts_config})}">
        <th:block th:fragment="scripts_config"></th:block>
    </th:block>
</body>

</html>
