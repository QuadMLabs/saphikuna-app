<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin-head :: head(title=#{products.title}, additionalStyles=~{::css_exclusivo})}">
    <th:block th:fragment="css_exclusivo">
    </th:block>
</head>

<body>

    <div class="admin-layout">

        <!-- Sidebar -->
        <div th:replace="~{fragments/admin-sidebar :: sidebar}">
        </div>


        <!-- Main -->
        <div class="admin-main">

            <!-- Topbar -->
            <div th:replace="~{fragments/admin-topbar :: topbar}">

            <!-- Page content -->
            <main class="admin-content">

            </main>

        </div>

    <th:block th:replace="~{fragments/admin-scripts :: global-scripts(~{})}"></th:block>
