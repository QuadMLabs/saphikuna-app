<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin-head :: head(title=#{products.title}, additionalStyles=~{::css_exclusivo})}">
    <th:block th:fragment="css_exclusivo">
        <link rel="stylesheet" th:href="@{/css/products/products.css}">
    </th:block>
</head>

<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside th:replace="~{fragments/admin-sidebar :: sidebar}"></aside>
        <!-- Main -->
        <main class="admin-main">
            <!-- Topbar -->
            <header th:replace="~{fragments/admin-topbar :: topbar}"></header>
            <!-- Content -->
            <section class="admin-content">

                <!-- Header -->
                <div class="page-header-row">
                    <div class="page-header">
                        <h1 class="page-title" th:text="#{products.title}"></h1>
                        <p class="page-subtitle" th:text="#{products.subtitle}"></p>
                    </div>
                    <a th:href="@{/admin/products/new}" class="primary-button">
                        <i data-lucide="plus"></i>
                        <span th:text="#{products.new}"></span>
                    </a>
                </div>

                <!-- Mensajes -->
                <div class="flash flash-success" role="status" th:if="${flashMessage != null}"
                    th:text="#{${flashMessage}}"></div>
                <div class="flash flash-error" role="alert" th:if="${flashError != null}"
                    th:text="#{${flashError}}"></div>

                <!-- Filtros: formulario GET normal -->
                <form class="filter-bar" method="get" th:action="@{/admin/products}">
                    <div class="filter-search">
                        <input type="search" name="q" class="form-input" th:value="${q}"
                            th:placeholder="#{products.filter.search.ph}" th:aria-label="#{common.search}">
                    </div>
                    <select name="categoryId" class="form-select" th:aria-label="#{products.category}">
                        <option value="" th:text="#{products.filter.category.all}"></option>
                        <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.name}"
                            th:selected="${c.categoryId.toString() == categoryId}"></option>
                    </select>
                    <select name="collectionId" class="form-select" th:aria-label="#{products.collection}">
                        <option value="" th:text="#{products.filter.collection.all}"></option>
                        <option th:each="c : ${collections}" th:value="${c.collectionId}" th:text="${c.name}"
                            th:selected="${c.collectionId.toString() == collectionId}"></option>
                    </select>
                    <select name="availability" class="form-select" th:aria-label="#{products.availability}">
                        <option value="" th:text="#{products.filter.availability.all}"></option>
                        <option th:each="a : ${T(java.util.List).of('Disponible', 'Agotado', 'Bajo pedido')}"
                            th:value="${a}" th:text="${a}" th:selected="${a == availability}"></option>
                    </select>
                    <select name="status" class="form-select" th:aria-label="#{products.status}">
                        <option value="" th:text="#{products.filter.status.all}"></option>
                        <option value="Activo" th:selected="${status == 'Activo'}" th:text="#{products.status.visible}">
                        </option>
                        <option value="Inactivo" th:selected="${status == 'Inactivo'}"
                            th:text="#{products.status.hidden}"></option>
                    </select>
                    <div class="filter-actions">
                        <a th:if="${hasFilters}" th:href="@{/admin/products}" class="secondary-button"
                            th:text="#{common.clear}"></a>
                        <button type="submit" class="primary-button">
                            <i data-lucide="search"></i>
                            <span th:text="#{common.search}"></span>
                        </button>
                    </div>
                </form>

                <!-- Vacío -->
                <div class="list-empty" th:if="${products.empty}"
                    th:text="${hasFilters} ? #{products.table.empty.filtered} : #{products.table.empty}"></div>

                <!-- Lista: tarjetas en celular, tabla en pantallas grandes -->
                <div class="product-list" th:unless="${products.empty}">
                    <div class="product-list-head" aria-hidden="true">
                        <span></span>
                        <span th:text="#{products.table.column.name}"></span>
                        <span th:text="#{products.table.column.colors}"></span>
                        <span th:text="#{products.table.column.sizes}"></span>
                        <span th:text="#{products.table.column.price}"></span>
                        <span th:text="#{products.table.column.status}"></span>
                        <span th:text="#{products.table.column.actions}"></span>
                    </div>

                    <article class="product-row" th:each="product : ${products.content}">
                        <!-- Foto principal: miniatura; al tocarla se abre ampliada (popover nativo, sin JS) -->
                        <div class="pr-thumb">
                            <th:block th:if="${thumbs.containsKey(product.productId)}">
                                <button type="button" class="pr-thumb-btn" th:attr="popovertarget='photo-' + ${product.productId}"
                                    th:title="#{products.table.column.image.show}"
                                    th:aria-label="#{products.table.column.image.show}">
                                    <img th:src="${thumbs.get(product.productId)}" alt="" loading="lazy">
                                </button>
                                <div class="image-popover" popover th:id="'photo-' + ${product.productId}">
                                    <img th:src="${fulls.get(product.productId)}" th:alt="${product.name}" loading="lazy">
                                    <p class="image-popover-caption" th:text="${product.name}"></p>
                                    <button type="button" class="image-popover-close"
                                        th:attr="popovertarget='photo-' + ${product.productId},popovertargetaction='hide'"
                                        th:aria-label="#{common.close}">
                                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
                                    </button>
                                </div>
                            </th:block>
                            <span class="pr-thumb-empty" th:unless="${thumbs.containsKey(product.productId)}">
                                <i data-lucide="image-off"></i>
                            </span>
                        </div>

                        <!-- Nombre, código, categoría -->
                        <div class="pr-main">
                            <a class="pr-name" th:href="@{/admin/products/{id}/edit(id=${product.productId})}"
                                th:text="${product.name}"></a>
                            <span class="pr-sub">
                                <span th:if="${product.code != null}" th:text="${product.code}"></span>
                                <span th:if="${product.code != null and product.category != null}"> · </span>
                                <span th:if="${product.category != null}" th:text="${product.category.name}"></span>
                                <span th:each="pc : ${product.productCollections}"> · <span
                                        th:text="${pc.collection.name}"></span></span>
                            </span>
                        </div>

                        <!-- Colores y tallas (columnas separadas en pantallas grandes) -->
                        <div class="pr-attrs">
                            <div class="pr-colors">
                                <span class="color-dot" th:each="pcolor : ${product.productColors}"
                                    th:title="${pcolor.color.name}"
                                    th:style="'background:' + ${pcolor.color.hexCode}"></span>
                                <span class="muted pr-none" th:if="${#lists.isEmpty(product.productColors)}">—</span>
                            </div>
                            <div class="pr-sizes">
                                <span class="tag" th:each="ps : ${product.productSizes}"
                                    th:text="${ps.size.name}"></span>
                                <span class="muted pr-none" th:if="${#lists.isEmpty(product.productSizes)}">—</span>
                            </div>
                        </div>

                        <!-- Precio -->
                        <div class="pr-price">
                            <s th:if="${product.hasDiscount()}"
                                th:text="'$' + ${#numbers.formatDecimal(product.generalPrice, 1, 'COMMA', 2, 'POINT')}"></s>
                            <span
                                th:text="'$' + ${#numbers.formatDecimal(product.finalPrice, 1, 'COMMA', 2, 'POINT')}"></span>
                            <span class="tag badge-request" th:if="${product.hasDiscount()}"
                                th:text="'-' + ${#numbers.formatDecimal(product.discountPercent, 1, 0)} + '%'"></span>
                        </div>

                        <!-- Estado -->
                        <div class="pr-state">
                            <span class="tag"
                                th:classappend="${product.availability == 'Disponible'} ? 'badge-available' : (${product.availability == 'Agotado'} ? 'badge-soldout' : 'badge-request')"
                                th:text="${product.availability}"></span>
                            <span class="tag" th:unless="${product.active}" th:text="#{products.status.hidden}"></span>
                        </div>

                        <!-- Acciones -->
                        <div class="pr-actions">
                            <a class="icon-button" th:href="@{/admin/products/{id}/edit(id=${product.productId})}"
                                th:title="#{common.edit}" th:aria-label="#{common.edit}">
                                <i data-lucide="pencil"></i>
                            </a>
                            <details class="row-delete">
                                <summary class="icon-button is-danger" th:title="#{common.delete}"
                                    th:aria-label="#{common.delete}">
                                    <i data-lucide="trash-2"></i>
                                </summary>
                                <form class="row-delete-pop" method="post" data-saving
                                    th:action="@{/admin/products/{id}/delete(id=${product.productId})}">
                                    <p th:text="#{products.delete.confirm(${product.name})}"></p>
                                    <button type="submit" class="danger-button" data-saving-button
                                        th:attr="data-saving-text=#{products.deleting}"
                                        th:text="#{products.delete.confirm.button}"></button>
                                </form>
                            </details>
                        </div>
                    </article>
                </div>

                <!-- Paginación -->
                <nav class="pager" th:if="${products.totalPages > 1}" aria-label="Paginación">
                    <a th:if="${products.hasPrevious()}"
                        th:href="@{/admin/products(page=${products.number - 1}, q=${q}, categoryId=${categoryId}, collectionId=${collectionId}, status=${status}, availability=${availability})}"
                        th:text="#{table.pagination.previous}"></a>
                    <span class="is-disabled" th:unless="${products.hasPrevious()}"
                        th:text="#{table.pagination.previous}"></span>

                    <span th:text="#{products.pager(${products.number + 1}, ${products.totalPages})}"></span>

                    <a th:if="${products.hasNext()}"
                        th:href="@{/admin/products(page=${products.number + 1}, q=${q}, categoryId=${categoryId}, collectionId=${collectionId}, status=${status}, availability=${availability})}"
                        th:text="#{table.pagination.next}"></a>
                    <span class="is-disabled" th:unless="${products.hasNext()}"
                        th:text="#{table.pagination.next}"></span>
                </nav>
            </section>
            <!-- Footer -->
            <footer th:replace="~{fragments/admin-footer :: footer}"></footer>
        </main>
    </div>
    <th:block th:replace="~{fragments/admin-scripts :: global-scripts(~{::scripts_productos})}">
        <th:block th:fragment="scripts_productos">
            <script th:src="@{/js/form-saving.js}"></script>
        </th:block>
    </th:block>
</body>

</html>
