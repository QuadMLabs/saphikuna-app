<aside class="admin-sidebar" th:fragment="sidebar">
    <!-- HEADER -->
    <div class="sidebar-header">
        <div class="sidebar-brand">
            <span class="sidebar-logo">
                <img th:src="@{/images/favicom_saphikuna.png}" alt="Saphikuna">
            </span>
            <span class="sidebar-brand-name" th:text="#{app.title}"></span>
        </div>

        <button type="button" class="sidebar-toggle" aria-label="Toggle sidebar">
            <i data-lucide="menu"></i>
        </button>
    </div>
    <!-- NAVIGATION -->
    <nav class="sidebar-navigation">
        <!-- MENU HOME -->
        <div class="sidebar-section">
            <span class="sidebar-section-title" th:text="#{menu.groups.home}"></span>
            <a href="#" class="sidebar-item" th:title="#{menu.home}">
                <span class="sidebar-item-icon">
                    <i data-lucide="home"></i>
                </span>
                <span class="sidebar-item-label" th:text="#{menu.home}"></span>
            </a>
        </div>
        <!-- MENU CATALOGO -->
        <div class="sidebar-section">
            <span class="sidebar-section-title" th:text="#{menu.groups.catalog}"></span>
            <!-- MENU PRODUCTOS -->
            <div class="sidebar-menu-group" th:classappend="${activeMenu == 'products'} ? ' is-open' : ''">
                <button type="button" class="sidebar-item sidebar-item-parent" th:title="#{menu.products}">
                    <span class="sidebar-item-main">
                        <span class="sidebar-item-icon">
                            <i data-lucide="shirt"></i>
                        </span>
                        <span class="sidebar-item-label" th:text="#{menu.products}"></span>
                    </span>
                    <span class="sidebar-item-arrow">
                        <i data-lucide="chevron-right"></i>
                    </span>
                </button>
                <!-- SUB MENU PRODUCTOS -->
                <div class="sidebar-submenu">
                    <a th:href="@{/admin/products}" class="sidebar-submenu-item"
                        th:classappend="${activeSubmenu == 'products-list'} ? ' is-active' : ''"
                        th:text="#{submenu.products.list}">
                    </a>
                    <a th:href="@{/admin/products-new}" class="sidebar-submenu-item" 
                        th:classappend="${activeSubmenu == 'products-new'} ? ' is-active' : ''"
                        th:text="#{submenu.products.add}">
                    </a>
                </div>
            </div>

            <!-- MENU COLECCIONES -->
            <div class="sidebar-menu-group">
                <button type="button" class="sidebar-item sidebar-item-parent" title="Colecciones">
                    <span class="sidebar-item-main">
                        <span class="sidebar-item-icon">
                            <i data-lucide="shopping-bag"></i>
                        </span>
                        <span class="sidebar-item-label">Colecciones</span>
                    </span>
                    <span class="sidebar-item-arrow">
                        <i data-lucide="chevron-right"></i>
                    </span>
                </button>
                <!-- SUB MENU COLECCIONES -->
                <div class="sidebar-submenu">
                    <a href="#" class="sidebar-submenu-item">
                        Todos los productos
                    </a>
                    <a href="#" class="sidebar-submenu-item">
                        Nuevo producto
                    </a>
                    <a href="#" class="sidebar-submenu-item">
                        Inventario
                    </a>
                </div>
            </div>
            <!-- MENU CATEGORIAS -->
            <div class="sidebar-menu-group">
                <button type="button" class="sidebar-item sidebar-item-parent" title="Categorías">
                    <span class="sidebar-item-main">
                        <span class="sidebar-item-icon">
                            <i data-lucide="tag"></i>
                        </span>
                        <span class="sidebar-item-label">Categorías</span>
                    </span>
                    <span class="sidebar-item-arrow">
                        <i data-lucide="chevron-right"></i>
                    </span>
                </button>
                <!-- SUB MENU CATEGORIAS -->
                <div class="sidebar-submenu">
                    <a href="#" class="sidebar-submenu-item">
                        Todos los productos
                    </a>
                    <a href="#" class="sidebar-submenu-item">
                        Nuevo producto
                    </a>
                    <a href="#" class="sidebar-submenu-item">
                        Inventario
                    </a>
                </div>
            </div>
        </div>

        <!-- MENU ATRIBUTOS -->
        <div class="sidebar-section">
            <span class="sidebar-section-title">ATRIBUTOS</span>
            <!-- MENU COLORES -->
            <div class="sidebar-menu-group">
                <button type="button" class="sidebar-item sidebar-item-parent" title="Colores">
                    <span class="sidebar-item-main">
                        <span class="sidebar-item-icon">
                            <i data-lucide="palette"></i>
                        </span>
                        <span class="sidebar-item-label">Colores</span>
                    </span>
                    <span class="sidebar-item-arrow">
                        <i data-lucide="chevron-right"></i>
                    </span>
                </button>
                <!-- SUB MENU PRODUCTOS -->
                <div class="sidebar-submenu">
                    <a href="#" class="sidebar-submenu-item">
                        Todos los productos
                    </a>
                    <a href="#" class="sidebar-submenu-item">
                        Nuevo producto
                    </a>
                    <a href="#" class="sidebar-submenu-item">
                        Inventario
                    </a>
                </div>
            </div>

            <!-- MENU TALLAS -->
            <div class="sidebar-menu-group">
                <button type="button" class="sidebar-item sidebar-item-parent" title="Tallas">
                    <span class="sidebar-item-main">
                        <span class="sidebar-item-icon">
                            <i data-lucide="ruler-dimension-line"></i>
                        </span>
                        <span class="sidebar-item-label">Tallas</span>
                    </span>
                    <span class="sidebar-item-arrow">
                        <i data-lucide="chevron-right"></i>
                    </span>
                </button>
                <!-- SUB MENU TALLAS -->
                <div class="sidebar-submenu">
                    <a href="#" class="sidebar-submenu-item">
                        Todos los productos
                    </a>
                    <a href="#" class="sidebar-submenu-item">
                        Nuevo producto
                    </a>
                    <a href="#" class="sidebar-submenu-item">
                        Inventario
                    </a>
                </div>
            </div>
            <!-- MENU MATERIALES -->
            <div class="sidebar-menu-group">
                <button type="button" class="sidebar-item sidebar-item-parent" title="Materiales">
                    <span class="sidebar-item-main">
                        <span class="sidebar-item-icon">
                            <i data-lucide="spool"></i>
                        </span>
                        <span class="sidebar-item-label">Materiales</span>
                    </span>
                    <span class="sidebar-item-arrow">
                        <i data-lucide="chevron-right"></i>
                    </span>
                </button>
                <!-- SUB MENU MATERIALES -->
                <div class="sidebar-submenu">
                    <a href="#" class="sidebar-submenu-item">
                        Todos los productos
                    </a>
                    <a href="#" class="sidebar-submenu-item">
                        Nuevo producto
                    </a>
                    <a href="#" class="sidebar-submenu-item">
                        Inventario
                    </a>
                </div>
            </div>
        </div>

        <!-- MENU CONFIGURACION -->
        <div class="sidebar-section">
            <span class="sidebar-section-title">CONFIGURACIÓN</span>
            <!-- MENU CONFIGURACION -->
            <a href="#" class="sidebar-item" title="Configuración">
                <span class="sidebar-item-icon">
                    <i data-lucide="settings"></i>
                </span>
                <span class="sidebar-item-label">Configuración</span>
            </a>
        </div>
    </nav>
</aside>
