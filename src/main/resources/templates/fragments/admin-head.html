<head th:fragment="head(title, additionalStyles)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - ' + #{app.title}"></title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/icon.svg}">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">
    <meta name="theme-color" content="#6C47FF">
    <th:block th:replace="~{fragments/admin-styles :: global-styles(${additionalStyles})}"></th:block>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
