spring.application.name=saphikuna

# Las credenciales NO van aqui: viven en el archivo .env (no se sube a git) o en variables
# de entorno. Ver .env.example.
spring.config.import=optional:file:.env[.properties]

# =========================================================
# DATA STORAGE SUPABASE
# =========================================================
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# =========================================================
# IMAGE STORAGE SUPABASE
# =========================================================
supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.storage.bucket=images
supabase.storage.max-width=1600
supabase.storage.max-height=1600
supabase.storage.max-original-size=15728640
supabase.storage.webp-quality=0.85
# Tamano objetivo por imagen (bytes). Se baja calidad/dimensiones hasta cumplirlo.
supabase.storage.max-bytes=153600
supabase.storage.thumb-size=400

# =========================================================
# UPLOADS / PRODUCTOS
# =========================================================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=60MB
app.products.max-images=4
spring.jpa.properties.hibernate.default_batch_fetch_size=20
# Un formulario multipart envia 1 parte por campo; el default de Tomcat (50) se queda corto
server.tomcat.max-part-count=200

# =========================================================
# SEGURIDAD / INICIO DE SESION
# =========================================================
# Clave para firmar la cookie "Recordarme". Cambiarla cierra todas las sesiones recordadas.
# En produccion definirla con la variable de entorno SAPHIKUNA_REMEMBER_KEY.
app.security.remember-key=${SAPHIKUNA_REMEMBER_KEY}
# Sin actividad, la sesion normal dura 8 horas (con "Recordarme" el login es automatico por 30 dias)
server.servlet.session.timeout=8h
# Primer administrador (solo se crea si la tabla esta vacia). Sin clave, se genera una y sale en el log.
app.bootstrap.username=admin
app.bootstrap.password=${SAPHIKUNA_ADMIN_PASSWORD:}

# Enlace del menu "Tienda" hacia la app de ventas (vacio = no se muestra el enlace)
app.store-url=${SAPHIKUNA_STORE_URL:https://saphikuna.netlify.app/}
